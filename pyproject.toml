[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliance-summarizer"
version = "0.2.0"
description = "Deterministic RF compliance workbook summaries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5,<4",
]

[project.scripts]
compliance-summarizer = "compliance_summarizer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_summarizer"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
